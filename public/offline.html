<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0c" />
  <title>Offline · BubbleSchedule</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
      background: #0a0a0c; color: #ececf1;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
    }
    .orb {
      width: 96px; height: 96px; margin: 0 auto 28px; border-radius: 50%;
      border: 1px solid rgb(255 77 90 / 0.8);
      background:
        radial-gradient(circle at 30% 20%, rgb(255 255 255 / 0.22), transparent 34%),
        radial-gradient(circle at 50% 58%, rgb(8 8 10 / 0.72) 40%, rgb(255 36 70 / 0.3) 100%);
      box-shadow: inset 0 0 22px rgb(255 36 70 / 0.5), 0 0 34px -4px rgb(255 36 70 / 0.45);
    }
    h1 { margin: 0 0 8px; font-size: 1.4rem; }
    p { margin: 0 0 24px; color: #8b8b9a; max-width: 28ch; line-height: 1.5; }
    button {
      border: 0; border-radius: 999px; padding: 12px 26px; font: inherit; font-weight: 600;
      background: #ececf1; color: #0a0a0c; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <div class="orb" aria-hidden="true"></div>
    <h1>You're offline</h1>
    <p>BubbleSchedule needs a connection to sync your bubbles. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
